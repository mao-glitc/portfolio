# Claude Code on GitHub Actions
#   review  : PR を開いた/更新したときに自動レビュー（トップコメント + インライン指摘）
#   mention : Issue / PR のコメントで @claude と呼ばれたら応える
# 書式は anthropics/claude-code-action の examples/claude.yml と docs/solutions.md（Automatic PR Code Review）に準拠。
# 認証: リポジトリシークレット ANTHROPIC_API_KEY（値はここに書かない）。
name: Claude Code

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

# 既定は何も渡さず、ジョブごとに必要な分だけ開ける
permissions: {}

jobs:
  review:
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude PR review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            このリポジトリは静的ポートフォリオサイト（profile.json → build.mjs / render.mjs → dist/、Cloudflare Pages）です。
            この PR を次の観点でレビューしてください。指摘は日本語で、結論から短く。
            - バグ・ビルドが壊れる変更（build.mjs / render.mjs / profile.json の整合）
            - セキュリティ（秘密情報の混入、外部スクリプトの読み込み、XSS につながる生 HTML 埋め込み）
            - アクセシビリティと表示崩れ（モバイル幅、コントラスト）
            - profile.json の実績記述が事実から盛られていないか

            Note: The PR branch is already checked out in the current working directory.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to highlight specific code issues.
            Only post GitHub comments - don't submit review text as messages.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  mention:
    # 公開リポジトリなので、呼べるのはオーナー・メンバー・コラボレーターだけ（API 料金の踏み倒し対策）
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      ) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
           github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 頼まれたときにブランチへコミットするため
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
